[project]
name = "agent-bridge"
version = "0.1.0"
description = "Pluggable messenger ↔ coding-agent bridge (Telegram, OpenCode, …)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "telethon>=1.40",
]

[project.scripts]
agent-bridge = "opencode_tg.bot:main"

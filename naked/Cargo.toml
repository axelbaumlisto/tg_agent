[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio-stream = "0.1"
glob = "0.3"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
base64 = "0.22"
blake3 = "1"

teloxide = { version = "0.17", features = ["macros", "rustls", "ctrlc_handler"], default-features = false }

[workspace.dependencies.tempfile]
version = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "naked-core"
version.workspace = true
edition.workspace = true

[features]
test-hooks = []

[dependencies]
arc-swap = "1"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = "2"
ignore = "0.4"
regex-lite = "0.1"
async-trait = { workspace = true }
tokio-stream = { workspace = true }
glob = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures-util = "0.3"
async-stream = "0.3"
regex = "1"
base64 = { workspace = true }
blake3 = { workspace = true }
# RATIONALE: PLAN_FAST_BACKEND_v2 Step B requires explicit SHA-256 full-file stale-edit preconditions.
sha2 = "0.10"
toml = "0.8"
unicode-normalization = "0.1"
# RATIONALE: PLAN_FAST_BACKEND_v1 Step 2b needs fff 0.9.5 SharedFilePicker/new_with_shared_state fast-index lifecycle.
fff-search = "0.9.5"
# RATIONALE: keep query parser version aligned with fff-search 0.9.5 API.
fff-query-parser = "0.9.5"
parking_lot = "0.12.5"

[dev-dependencies]
# RATIONALE: integration tests need the memory-root hook without exposing it in ordinary debug builds.
naked-core = { path = ".", features = ["test-hooks"] }
proptest = "1"
tempfile = { workspace = true }
filetime = "0.2"
tracing-subscriber = { workspace = true }
wiremock = "0.6"
insta = "1"
# RATIONALE: PLAN_FAST_BACKEND_v1 Step 1a hot-path microbench harness (dev-only), async_tokio drives async Tool trait.
criterion = { version = "0.5", features = ["async_tokio"] }

# RATIONALE: registers benches/hotpath.rs as a custom-harness (criterion) benchmark target.
[[bench]]
name = "hotpath"
harness = false

[lints]
workspace = true

[package]
name = "naked-cli"
version.workspace = true
edition.workspace = true

default-run = "naked"

[[bin]]
name = "naked"
path = "src/main.rs"

[[bin]]
name = "naked-catalog-export"
path = "src/bin/catalog_export.rs"

[[bin]]
name = "naked-validate-brief"
path = "src/bin/validate_brief.rs"

[dependencies]
naked-core = { path = "../naked-core" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
